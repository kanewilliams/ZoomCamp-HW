[project]
name = "25-mlops"
version = "0.1.0"
description = "uv files for MLOps zoomcamp :-)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.8",
    "django>=5.2.1",
    "evidently==0.6.7",
    "hyperopt>=0.2.7",
    "ipykernel>=6.29.5",
    "joblib>=1.3.0",
    "jupyter>=1.0.0",
    "marimo>=0.13.10",
    "matplotlib>=3.10.3",
    "mlflow==2.22.0",
    "nbconvert>=7.16.6",
    "numpy>=1.22.0,<2.1",
    "pandas>=2.2.3",
    "polars>=1.30.0",
    "prefect>=3.4.4",
    "protobuf<4.0.0",
    "psycopg>=3.1.0",
    "psycopg-binary>=3.1.0",
    "pyarrow>=14.0.0",
    "requests>=2.31.0",
    "s3fs>=2025.5.1",
    "scikit-learn>=1.6.1",
    "setuptools>=80.8.0",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]
